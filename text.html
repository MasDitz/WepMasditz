<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bot WhatsApp Saya</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #333;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
    }
    .whatsapp-button {
      display: block;
      text-align: center;
      background-color: #25D366;
      color: white;
      padding: 15px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      margin: 20px 0;
    }
    form input, form textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    form button {
      background: #333;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 6px;
      width: 100%;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Bot WhatsApp Saya</h1>
  <p>Selamat datang! Hubungi saya lewat WhatsApp atau isi formulir di bawah ini.</p>

  <a class="whatsapp-button" href="https://wa.me/6283849495963" target="_blank">
    Chat di WhatsApp
  </a>

  <form action="#" method="post" onsubmit="alert('Pesan terkirim! (simulasi)'); return false;">
    <input type="text" name="name" placeholder="Nama Anda" required>
    <input type="email" name="email" placeholder="Email Anda" required>
    <textarea name="message" rows="5" placeholder="Pesan Anda..." required></textarea>
    <button type="submit">Kirim</button>
  </form>
</div>

</body>
</html>
